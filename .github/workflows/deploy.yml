name: Deploy pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Code-ref check needs an n8n checkout, so it is skipped here (N8N_REPO unset)
      - run: npm run verify

      # --download renders a PDF during the build, which needs Chromium
      - run: npx playwright install --with-deps chromium

      # Pages decides the base path (project path on public sites, root on private org sites)
      - uses: actions/configure-pages@v6
        id: pages
        if: github.event_name != 'pull_request'

      - run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/" --download

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
